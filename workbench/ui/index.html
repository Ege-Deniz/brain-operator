  function syncComposerControls(t) {
    const isRunning = t.status === "running" || state.liveStreams.has(t.id);
    $("stopBtn").hidden = !isRunning;
    $("sendBtn").disabled = isRunning;

    const provSel = $("compProvider");
    const modeSel = $("compMode");
    if (provSel.dataset.threadBound !== t.id) {
      provSel.value = t.provider || "claude";
      modeSel.value = t.mode || "read-only";
      $("compModel").value = t.model || "";
      provSel.dataset.threadBound = t.id;
      renderProviders();
    }
    updateHandoffHint(t);
  }

  function updateHandoffHint(t) {
    const hint = $("handoffHint");
    if (!t || !state.selectedThreadTurns.length) { hint.hidden = true; return; }
    const chosen = $("compProvider").value;
    const lastTurn = state.selectedThreadTurns[state.selectedThreadTurns.length - 1];
    if (lastTurn && lastTurn.provider && lastTurn.provider !== chosen) {
      hint.hidden = false;
      hint.textContent = `Cross-provider handoff active: bridging ${lastTurn.provider} → ${chosen} (${state.selectedThreadTurns.length} prior turn${state.selectedThreadTurns.length === 1 ? "" : "s"}).`;
    } else {
      hint.hidden = true;
    }
  }

  function updateLayoutClasses() {
    const root = $("appRoot");
    root.classList.toggle("inspector-closed", !state.inspectorOpen);
    root.classList.toggle("inspector-force-open", state.inspectorOpen);
  }

  function toggleInspector() {
    state.inspectorOpen = !state.inspectorOpen;
    updateLayoutClasses();
    renderTopbar();
    if (state.inspectorOpen) renderInspector();
  }

  function setView(v) {
    state.view = v;
    document.querySelectorAll(".nav-tab").forEach((el) => el.classList.toggle("active", el.dataset.view === v));
    renderTopbar();
    renderStage();
    renderThreadList();
    if (v === "observatory") loadObservatory();
    if (v === "fleet") loadContext();
  }

  function renderAll() {
    $("verPill").textContent = `v${state.version}`;
    renderWorkspaces();
    renderProviders();
    renderThreadList();
    renderTopbar();
    renderStage();
    renderInspector();
  }

  // ---------- Data Loading ----------

  function upsertThreadLocal(thread) {
    if (!thread) return;
    const idx = state.threads.findIndex((t) => t.id === thread.id);
    if (idx >= 0) state.threads[idx] = thread;
    else state.threads.unshift(thread);
  }

  async function refreshBootstrap() {
    const data = await api("/api/bootstrap");
    state.version = data.version || state.version;
    state.providers = data.providers || {};
    state.workspaces = data.workspaces || [];
    if (!state.activeWorkspaceId || !state.workspaces.some((w) => w.id === state.activeWorkspaceId)) {
      state.activeWorkspaceId = data.activeWorkspaceId;
    }
    state.threads = data.threads || [];
    for (const t of state.threads) {
      if (t.activeRun) state.liveStreams.set(t.id, t.activeRun);
    }
    renderAll();
    if (state.activeWorkspaceId) {
      loadContext();
      loadObservatory();
    }
  }

  async function selectThread(threadId) {
    state.selectedThreadId = threadId;
    state.view = "threads";
    document.querySelectorAll(".nav-tab").forEach((el) => el.classList.toggle("active", el.dataset.view === "threads"));
    $("compProvider").dataset.threadBound = "";
    await loadThreadDetail(threadId);
    renderAll();
    loadDiff();
    $("composerInput").focus();
  }

  async function loadThreadDetail(threadId) {
    if (!threadId) return;
    try {
      const data = await api(`/api/threads/${encodeURIComponent(threadId)}`);
      upsertThreadLocal(data.thread);
      state.selectedThreadTurns = data.turns || [];
      if (data.thread.activeRun) state.liveStreams.set(threadId, data.thread.activeRun);
      const last = state.selectedThreadTurns[state.selectedThreadTurns.length - 1];
      state.selectedTurnId = last ? last.id : null;
      renderTopbar();
      renderStage();
      renderInspector();
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function loadDiff() {
    if (!state.selectedThreadId) return;
    try {
      state.diffCache = await api(`/api/threads/${encodeURIComponent(state.selectedThreadId)}/diff`);
      if (state.inspectorTab === "diff") renderInspector();
    } catch { /* ignore */ }
  }

  async function loadContext() {
    const ws = activeWorkspace();
    if (!ws) return;
    try {
      state.contextCache = await api(`/api/workspaces/${encodeURIComponent(ws.id)}/context`);
      if (state.inspectorTab === "context") renderInspector();
      if (state.view === "fleet") renderStage();
    } catch { /* ignore */ }
  }

  async function loadObservatory() {
    const ws = activeWorkspace();
    if (!ws) return;
    try {
      state.observatoryCache = await api(`/api/workspaces/${encodeURIComponent(ws.id)}/observatory`);
      if (state.view === "observatory") renderStage();
    } catch { /* ignore */ }
  }

  async function quickCreateThread(mode) {
    const ws = activeWorkspace();
    if (!ws) { openModal("addWsModal"); return; }
    try {
      const res = await api("/api/threads", {
        method: "POST",
        body: JSON.stringify({
          workspaceId: ws.id,
          mode,
          useWorktree: mode === "worktree",
        }),
      });
      upsertThreadLocal(res.thread);
      await selectThread(res.thread.id);
      if (mode === "worktree") toast(`Created isolated worktree ${res.thread.worktree.branch}`);
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function sendComposerPrompt() {
    const t = selectedThread();
    if (!t) return;
    const input = $("composerInput");
    const prompt = input.value.trim();
    if (!prompt) return;

    const provider = $("compProvider").value;
    const mode = $("compMode").value;
    const model = $("compModel").value.trim();

    try {
      input.value = "";
      await api(`/api/threads/${encodeURIComponent(t.id)}/turns`, {
        method: "POST",
        body: JSON.stringify({ prompt, provider, mode, model }),
      });
    } catch (err) {
      input.value = prompt;
      toast(err.message, true);
    }
  }

  // ---------- Modals & Command Palette ----------

  function openModal(id) {
    $(id).hidden = false;
    const firstInput = $(id).querySelector("input");
    if (firstInput) setTimeout(() => firstInput.focus(), 20);
  }

  function closeModal(id) {
    $(id).hidden = true;
  }

  function openNewThreadModal(defaultMode) {
    if (!activeWorkspace()) { openModal("addWsModal"); return; }
    $("ntTitle").value = "";
    $("ntModel").value = "";
    $("ntMode").value = defaultMode || "read-only";
    const provs = state.providers;
    $("ntProvider").value = (provs.claude && provs.claude.available) ? "claude"
      : (provs.gemini && provs.gemini.available) ? "gemini"
      : (provs.codex && provs.codex.available) ? "codex"
      : "sim";
    openModal("newThreadModal");
  }

  function renderPalette(query) {
    const q = String(query || "").trim().toLowerCase();
    const actions = [
      { label: "New Read-only Thread", hint: "Ask / inspect", run: () => quickCreateThread("read-only") },
      { label: "New Isolated Worktree Thread", hint: "Orca parallel branch", run: () => quickCreateThread("worktree") },
      { label: "Open Agent Fleet & Worktrees", hint: "View", run: () => setView("fleet") },
      { label: "Open Observatory", hint: "Faithfulness dashboard", run: () => setView("observatory") },
      { label: "Add Repository or Vault", hint: "Workspace", run: () => openModal("addWsModal") },
      { label: "Toggle Inspector Drawer", hint: "Diff / Trace / Context", run: () => toggleInspector() },
      ...visibleThreads().map((t) => ({
        label: t.title,
        hint: `${t.provider}${t.worktree ? ` · ${t.worktree.branch}` : ""}`,
        run: () => selectThread(t.id),
      })),
    ].filter((a) => !q || a.label.toLowerCase().includes(q) || a.hint.toLowerCase().includes(q));

    const listEl = $("paletteList");
    listEl.innerHTML = actions.slice(0, 14).map((a, i) => `
      <button class="palette-row${i === 0 ? " sel" : ""}" data-idx="${i}">
        <span>${esc(a.label)}</span>
        <span class="palette-hint">${esc(a.hint)}</span>
      </button>`).join("");
    listEl._actions = actions;
    listEl.querySelectorAll(".palette-row").forEach((btn) => {
      btn.onclick = () => {
        const act = actions[Number(btn.dataset.idx)];
        closeModal("paletteModal");
        if (act) act.run();
      };
    });
  }

  // ---------- Live SSE Subscription ----------

  function connectSSE() {
    const es = new EventSource("/api/events");

    es.addEventListener("hello", () => {
      state.sseConnected = true;
      renderTopbar();
    });

    es.addEventListener("thread:created", (e) => {
      const { thread } = JSON.parse(e.data);
      upsertThreadLocal(thread);
      renderThreadList();
      if (state.view === "fleet") renderStage();
    });

    es.addEventListener("thread:updated", (e) => {
      const { thread } = JSON.parse(e.data);
      upsertThreadLocal(thread);
      renderThreadList();
      if (thread.id === state.selectedThreadId) renderTopbar();
      if (state.view === "fleet") renderStage();
    });

    es.addEventListener("thread:deleted", (e) => {
      const { threadId } = JSON.parse(e.data);
      state.threads = state.threads.filter((t) => t.id !== threadId);
      state.liveStreams.delete(threadId);
      if (state.selectedThreadId === threadId) {
        state.selectedThreadId = null;
        state.selectedThreadTurns = [];
      }
      renderAll();
    });

    es.addEventListener("run:started", (e) => {
      const { threadId, run, thread } = JSON.parse(e.data);
      upsertThreadLocal(thread);
      state.liveStreams.set(threadId, run);
      renderThreadList();
      if (threadId === state.selectedThreadId && state.view === "threads") {
        renderStage();
      } else if (state.view === "fleet") {
        renderStage();
      }
    });

    es.addEventListener("run:event", (e) => {
      const { threadId, event, statusText } = JSON.parse(e.data);
      const live = state.liveStreams.get(threadId);
      if (!live) return;
      if (statusText) live.statusText = statusText;
      if (event.type === "delta" && event.text) {
        live.answerBuffer = (live.answerBuffer || "") + event.text;
        if (threadId === state.selectedThreadId && state.view === "threads") {
          const body = $("liveAnswerBody");
          if (body) {
            body.innerHTML = renderMarkdown(live.answerBuffer);
            const sc = $("stageScroll");
            sc.scrollTop = sc.scrollHeight;
            return;
          }
        }
      } else if (event.type === "tool") {
        live.toolCalls = live.toolCalls || [];
        const existing = live.toolCalls.find((x) => x.id === event.id);
        if (existing) Object.assign(existing, event);
        else live.toolCalls.push(event);
      } else if (event.type === "tool_result" && event.id) {
        const existing = (live.toolCalls || []).find((x) => x.id === event.id);
        if (existing) existing.status = event.status || "completed";
      }
      if (threadId === state.selectedThreadId && state.view === "threads") {
        renderStage();
      }
    });

    const onRunFinished = (e) => {
      const { threadId, turn, thread } = JSON.parse(e.data);
      state.liveStreams.delete(threadId);
      upsertThreadLocal(thread);
      renderThreadList();
      if (threadId === state.selectedThreadId) {
        state.selectedThreadTurns.push(turn);
        state.selectedTurnId = turn.id;
        renderTopbar();
        renderStage();
        renderInspector();
        loadDiff();
      } else if (state.view === "fleet") {
        renderStage();
      }
      loadObservatory();
      loadContext();
    };
    es.addEventListener("run:completed", onRunFinished);
    es.addEventListener("run:cancelled", onRunFinished);
    es.addEventListener("run:error", onRunFinished);

    es.addEventListener("worktree:changed", () => {
      loadDiff();
      loadContext();
    });

    es.onerror = () => {
      state.sseConnected = false;
      renderTopbar();
    };
  }

  // ---------- Event Wiring ----------

  $("wsSelect").addEventListener("change", (e) => {
    state.activeWorkspaceId = e.target.value;
    state.selectedThreadId = null;
    state.selectedThreadTurns = [];
    state.diffCache = null;
    renderAll();
    loadContext();
    loadObservatory();
  });

  $("addWsBtn").onclick = () => openModal("addWsModal");
  $("newThreadBtn").onclick = () => openNewThreadModal("read-only");
  $("openPaletteBtn").onclick = () => {
    $("paletteInput").value = "";
    renderPalette("");
    openModal("paletteModal");
  };

  $("threadSearch").addEventListener("input", (e) => {
    state.searchQuery = e.target.value;
    renderThreadList();
  });
  $("toggleArchiveBtn").onclick = () => {
    state.showArchived = !state.showArchived;
    $("toggleArchiveBtn").classList.toggle("amber", state.showArchived);
    renderThreadList();
  };

  document.querySelectorAll(".nav-tab").forEach((btn) => {
    btn.onclick = () => setView(btn.dataset.view);
  });

  document.querySelectorAll(".insp-tab").forEach((btn) => {
    btn.onclick = () => {
      state.inspectorTab = btn.dataset.itab;
      renderInspector();
      if (state.inspectorTab === "diff") loadDiff();
      if (state.inspectorTab === "context") loadContext();
    };
  });
  $("refreshInspBtn").onclick = () => {
    if (state.inspectorTab === "diff") loadDiff();
    else if (state.inspectorTab === "context") loadContext();
    else renderInspector();
  };

  $("compProvider").addEventListener("change", () => {
    renderProviders();
    updateHandoffHint(selectedThread());
  });
  $("sendBtn").onclick = sendComposerPrompt;
  $("stopBtn").onclick = async () => {
    const t = selectedThread();
    if (!t) return;
    await api(`/api/threads/${encodeURIComponent(t.id)}/cancel`, { method: "POST" });
    toast("Cancelling run…");
  };
  $("composerInput").addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      sendComposerPrompt();
    } else if (e.key === "Escape") {
      const t = selectedThread();
      if (t && (t.status === "running" || state.liveStreams.has(t.id))) {
        api(`/api/threads/${encodeURIComponent(t.id)}/cancel`, { method: "POST" });
      }
    }
  });

  $("ntCreateBtn").onclick = async () => {
    const ws = activeWorkspace();
    if (!ws) return;
    const mode = $("ntMode").value;
    try {
      const res = await api("/api/threads", {
        method: "POST",
        body: JSON.stringify({
          workspaceId: ws.id,
          title: $("ntTitle").value.trim(),
          provider: $("ntProvider").value,
          model: $("ntModel").value.trim(),
          mode,
          useWorktree: mode === "worktree",
        }),
      });
      closeModal("newThreadModal");
      upsertThreadLocal(res.thread);
      await selectThread(res.thread.id);
      toast(`Created thread "${res.thread.title}"`);
    } catch (err) {
      toast(err.message, true);
    }
  };

  $("awAddBtn").onclick = async () => {
    const p = $("awPath").value.trim();
    if (!p) { toast("Enter a folder path", true); return; }
    try {
      const res = await api("/api/workspaces", {
        method: "POST",
        body: JSON.stringify({ path: p, name: $("awName").value.trim() }),
      });
      closeModal("addWsModal");
      $("awPath").value = "";
      $("awName").value = "";
      state.activeWorkspaceId = res.workspace.id;
      await refreshBootstrap();
      toast(`Added workspace "${res.workspace.name}"`);
    } catch (err) {
      toast(err.message, true);
    }
  };

  $("paletteInput").addEventListener("input", (e) => renderPalette(e.target.value));
  $("paletteInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const first = $("paletteList")._actions && $("paletteList")._actions[0];
      if (first) { closeModal("paletteModal"); first.run(); }
    }
  });

  document.querySelectorAll("[data-close-modal]").forEach((b) => {
    b.onclick = () => closeModal(b.dataset.closeModal);
  });
  document.querySelectorAll(".modal-backdrop").forEach((m) => {
    m.addEventListener("click", (e) => { if (e.target === m) m.hidden = true; });
  });

  window.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      $("paletteInput").value = "";
      renderPalette("");
      openModal("paletteModal");
    } else if (e.key === "Escape") {
      ["newThreadModal", "addWsModal", "paletteModal"].forEach((id) => closeModal(id));
    }
  });

  // Boot
  updateLayoutClasses();
  connectSSE();
  refreshBootstrap().catch((err) => toast(`Failed to load: ${err.message}`, true));
})();
</script>
</body>
</html>
